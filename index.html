<div id="splash" aria-hidden="true">
  <style>
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#2f5bea 0%,#1d3fb8 100%);color:#fff;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;transition:opacity .5s ease,visibility .5s}
    #splash.hide{opacity:0;visibility:hidden}
    #splash .sl{width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.14);display:grid;place-items:center;animation:spPop .7s cubic-bezier(.2,1.4,.4,1) both,spPulse 2s 0.8s ease-in-out infinite}
    #splash .sl svg{width:60px;height:60px}
    #splash .sl path{stroke-dasharray:20;stroke-dashoffset:20;animation:spDraw .6s .35s ease forwards}
    #splash .sl path:nth-child(3){animation-delay:.5s}#splash .sl path:nth-child(4){animation-delay:.65s}
    #splash .sl circle{transform-origin:23px 21px;transform:scale(0);animation:spDot .4s .9s cubic-bezier(.2,1.6,.4,1) forwards}
    #splash h1{margin:0;font-size:28px;font-weight:800;animation:spUp .6s .3s both}
    #splash p{margin:-8px 0 0;font-size:15px;opacity:.85;animation:spUp .6s .45s both}
    #splash .bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px;animation:spUp .6s .6s both}
    #splash .bar i{display:block;width:40%;height:100%;border-radius:4px;background:#fff;animation:spBar 1.1s ease-in-out infinite}
    #splash .cr{position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:2px;animation:spUp .7s .8s both}#splash .cr span{font-size:13px;opacity:.75}#splash .cr b{font-size:19px;font-weight:800;margin-bottom:2px}
    @keyframes spPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes spPulse{50%{transform:scale(1.06)}}
    @keyframes spDraw{to{stroke-dashoffset:0}}
    @keyframes spDot{to{transform:scale(1)}}
    @keyframes spUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
    @keyframes spBar{from{transform:translateX(160%)}to{transform:translateX(-260%)}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important;stroke-dashoffset:0!important;transform:none!important}}
  </style>
  <div class="sl"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="22" rx="6" fill="#fff" opacity=".18"/><path d="M9 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M9 17h9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M9 22h5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/><circle cx="23" cy="21" r="4" fill="#fff"/></svg></div>

  <p>مكتبك الرقمي في مكان واحد</p>
  <div class="bar"><i></i></div>
  <div class="cr"><b>المعلمة حنان الصاعدي</b><span>مدرسة ابن هشام للطفولة المبكرة</span></div>
  <script>
    (function(){var t0=Date.now(),done=false;function hide(){if(done)return;done=true;var w=Math.max(0,2500-(Date.now()-t0));setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(function(){s.remove()},600)}},w)}
    window.hideSplash=hide;setTimeout(hide,6000);})();
  </script>
